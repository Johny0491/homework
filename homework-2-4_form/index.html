<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="css/style.css">


</head>

<body>
    <form class="form">
        <fieldset class="form-group">
            <legend class="form-group-title">Ваши личные данные</legend>
            <label class="label">Ваше имя</label>
            <input class="input" type="text" placeholder="Имя" name="name" required>

            <label class="label">Ваш возраст</label>
            <input class="input" type="number" placeholder="Возраст" name="age" required>

            <label class="label">Ваш номер телефона</label>
            <input class="input" type="tel" inputmode="tel" placeholder="Номер телефона" name="number" required>

            <label class="label">Ваша почта</label>
            <input class="input" type="email" placeholder="Почта" name="email" required>
        </fieldset>
        <fieldset class="form-group">
            <label for="message" class="label">Cообщение</label>
            <textarea class="textarea" id="message" placeholder="Ваше сообщение" name="message" required></textarea>
            <label class="label checkbox-label">
                <input class="checkbox" type="checkbox" name="agreement" required>
                <span class="checkbox-text">Я принимаю правила</span>
            </label>
        </fieldset>
        <button class="button">Отправить</button>
    </form>

</body>

</html>
